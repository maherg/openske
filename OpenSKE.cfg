SPECIFICATION OpenSKE

CONSTANT
    UNKNOWN = "UNKNOWN"
    SAFE = "SAFE" 
    RISKY = "RISKY"
    COMPROMISED = "COMPROMISED"
    
    ACTIVE = "ACTIVE"
    EXPIRED = "EXPIRED"
    LOCKED = "LOCKED"
    
    FILE = "FILE"
    DATABASE = "DATABASE"
    SERVICE = "SERVICE"
    
    NONE = "NONE"
    READ = "READ"
    READ_WRITE = "READ_WRITE"
    READ_EXECUTE = "READ_EXECUTE"
    READ_WRITE_EXECUTE = "READ_WRITE_EXECUTE"
    
    CWE_521 = "CWE-521"
    CWE_89 = "CWE-89"
    CWE_79 = "CWE-79"
    CWE_400 = "CWE-400"
    CWE_200 = "CWE-200"
    
    CAPEC_1 = "CAPEC-1"
    CAPEC_2 = "CAPEC-2"
    CAPEC_7 = "CAPEC-7"
    CAPEC_16 = "CAPEC-16"
    
    MaxHosts = 3
    MaxSoftware = 5
    MaxUsers = 2
    MaxAccounts = 4
    MaxAssets = 3

INVARIANT
    TypeInvariant
    SecurityStateMonotonicity
    NoCircularDependencies
    AccountStateConsistency

PROPERTY
    AttackReachability
    RiskPropagationCompleteness
    NoUnauthorizedCompromise